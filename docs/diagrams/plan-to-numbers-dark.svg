<title>From a plan item to the numbers on screen</title>
<desc>The owner adds an item to the plan; an API route saves the recurring rule; the materialize route writes its past occurrences as ledger rows with deterministic ids; live listeners read the ledger, aggregations convert amounts on read using the display currency and exchange rates, and the dashboard and domain pages render the totals.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-teal">
