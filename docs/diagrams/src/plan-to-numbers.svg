<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" role="img">
<title>From a plan item to the numbers on screen</title>
<desc>The owner adds an item to the plan; an API route saves the recurring rule; the materialize route writes its past occurrences as ledger rows with deterministic ids; live listeners read the ledger, aggregations convert amounts on read using the display currency and exchange rates, and the dashboard and domain pages render the totals.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-teal">
<rect x="30" y="30" width="190" height="56" rx="8"/>
<text class="th" x="125" y="49" text-anchor="middle" dominant-baseline="central">Add to plan</text>
<text class="ts" x="125" y="68" text-anchor="middle" dominant-baseline="central">one form, the + sheet</text>
</g>
<g class="s-purple">
<rect x="240" y="30" width="190" height="56" rx="8"/>
<text class="th" x="335" y="49" text-anchor="middle" dominant-baseline="central">Save the rule</text>
<text class="ts" x="335" y="68" text-anchor="middle" dominant-baseline="central">recurrentTransactions doc</text>
</g>
<g class="s-purple">
<rect x="450" y="30" width="190" height="56" rx="8"/>
<text class="tm" x="545" y="49" text-anchor="middle" dominant-baseline="central">materialize</text>
<text class="ts" x="545" y="68" text-anchor="middle" dominant-baseline="central">past occurrences, idempotent</text>
</g>
<g class="s-amber">
<rect x="660" y="30" width="190" height="56" rx="8"/>
<text class="th" x="755" y="49" text-anchor="middle" dominant-baseline="central">Ledger rows</text>
<text class="tm" x="755" y="68" text-anchor="middle" dominant-baseline="central">{itemId}_{date}</text>
</g>

<path class="arr" d="M220 58 H238" marker-end="url(#a)"/>
<path class="arr" d="M430 58 H448" marker-end="url(#a)"/>
<path class="arr" d="M640 58 H658" marker-end="url(#a)"/>

<path class="arr" d="M755 86 V123 H125 V158" marker-end="url(#a)"/>

<g class="s-teal">
<rect x="30" y="160" width="190" height="56" rx="8"/>
<text class="th" x="125" y="179" text-anchor="middle" dominant-baseline="central">Live listeners</text>
<text class="ts" x="125" y="198" text-anchor="middle" dominant-baseline="central">onSnapshot, IndexedDB cache</text>
</g>
<g class="s-teal">
<rect x="240" y="160" width="190" height="56" rx="8"/>
<text class="tm" x="335" y="179" text-anchor="middle" dominant-baseline="central">aggregations</text>
<text class="ts" x="335" y="198" text-anchor="middle" dominant-baseline="central">convert on read</text>
</g>
<g class="s-teal">
<rect x="450" y="160" width="190" height="56" rx="8"/>
<text class="th" x="545" y="179" text-anchor="middle" dominant-baseline="central">Screens</text>
<text class="ts" x="545" y="198" text-anchor="middle" dominant-baseline="central">dashboard, domain pages</text>
</g>

<path class="arr" d="M220 188 H238" marker-end="url(#a)"/>
<path class="arr" d="M430 188 H448" marker-end="url(#a)"/>

<g class="s-purple">
<rect x="30" y="290" width="190" height="56" rx="8"/>
<text class="tm" x="125" y="309" text-anchor="middle" dominant-baseline="central">/api/currencies</text>
<text class="ts" x="125" y="328" text-anchor="middle" dominant-baseline="central">12 h cache, daily mirror</text>
</g>
<g class="s-teal">
<rect x="240" y="290" width="190" height="56" rx="8"/>
<text class="tm" x="335" y="309" text-anchor="middle" dominant-baseline="central">useMoneyContext</text>
<text class="ts" x="335" y="328" text-anchor="middle" dominant-baseline="central">display currency, rates</text>
</g>

<path class="arr" d="M220 318 H238" marker-end="url(#a)"/>
<path class="arr" d="M335 290 V218" marker-end="url(#a)"/>
</svg>
