<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" role="img">
<title>Walleto system context (C4 level 1)</title>
<desc>An owner plans income, expenses, investments, savings and debts in Walleto; an admin reads usage counts. Walleto signs people in with Auth0, keeps every user's plan and ledger in Google Firebase, and fetches exchange rates from an external rates API.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="120" y="30" width="240" height="64" rx="32"/>
<text class="th" x="240" y="52" text-anchor="middle" dominant-baseline="central">Owner</text>
<text class="ts" x="240" y="72" text-anchor="middle" dominant-baseline="central">plans their own money</text>
</g>
<g class="s-gray">
<rect x="520" y="30" width="240" height="64" rx="32"/>
<text class="th" x="640" y="52" text-anchor="middle" dominant-baseline="central">Admin</text>
<text class="ts" x="640" y="72" text-anchor="middle" dominant-baseline="central">runs the deployment</text>
</g>

<g class="s-purple">
<rect x="240" y="190" width="400" height="90" rx="10"/>
<text class="th" x="440" y="214" text-anchor="middle" dominant-baseline="central">Walleto</text>
<text class="ts" x="440" y="240" text-anchor="middle" dominant-baseline="central">monthly plan across five domains,</text>
<text class="ts" x="440" y="258" text-anchor="middle" dominant-baseline="central">net worth, eight currencies</text>
</g>

<path class="arr" d="M300 94 V188" marker-end="url(#a)"/>
<text class="ts" x="290" y="141" text-anchor="end" dominant-baseline="central">plans, logs, checks worth</text>
<path class="arr" d="M580 94 V188" marker-end="url(#a)"/>
<text class="ts" x="590" y="141" dominant-baseline="central">reads usage at /admin</text>

<g class="s-gray">
<rect x="30" y="360" width="250" height="64" rx="10"/>
<text class="th" x="155" y="382" text-anchor="middle" dominant-baseline="central">Auth0</text>
<text class="ts" x="155" y="402" text-anchor="middle" dominant-baseline="central">Universal Login, Google</text>
</g>
<g class="s-gray">
<rect x="315" y="360" width="250" height="64" rx="10"/>
<text class="th" x="440" y="382" text-anchor="middle" dominant-baseline="central">Google Firebase</text>
<text class="ts" x="440" y="402" text-anchor="middle" dominant-baseline="central">Firestore, Firebase Auth</text>
</g>
<g class="s-gray">
<rect x="600" y="360" width="250" height="64" rx="10"/>
<text class="th" x="725" y="382" text-anchor="middle" dominant-baseline="central">Exchange rates API</text>
<text class="ts" x="725" y="402" text-anchor="middle" dominant-baseline="central">APILayer, USD base</text>
</g>

<path class="arr" d="M300 280 V322 H155 V358" marker-end="url(#a)"/>
<text class="ts" x="164" y="310" dominant-baseline="central">signs people in</text>
<path class="arr" d="M440 280 V358" marker-end="url(#a)"/>
<text class="ts" x="450" y="320" dominant-baseline="central">plan and ledger</text>
<path class="arr" d="M580 280 V322 H725 V358" marker-end="url(#a)"/>
<text class="ts" x="716" y="310" text-anchor="end" dominant-baseline="central">fetches FX rates</text>
</svg>
