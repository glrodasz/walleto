<title>Walleto containers (C4 level 2)</title>
<desc>The owner uses the app in the browser. The browser loads server-rendered pages and writes through API routes on Vercel, and reads Firestore live with the client SDK. API routes write Firestore with the Admin SDK, mint Firebase custom tokens, keep Auth0 sessions and fetch exchange rates.</desc>
